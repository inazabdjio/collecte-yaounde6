<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b5e20" />
  <title>Hors ligne — Collecte Yaoundé 6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f7f5;
      color: #1f2933;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 1.25rem;
      color: #1b5e20;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #52606d;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background-color: #1b5e20;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Connexion réseau indisponible</h1>
    <p>
      Vous êtes actuellement hors ligne. Les données déjà enregistrées localement restent accessibles dès que l'application est chargée.
    </p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
  </main>
</body>
</html>
